<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compresor Multimedia para Shopify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <h1>Compresor Multimedia</h1>
    <p class="subtitle">Comprime tus imágenes y videos para Shopify manteniendo la máxima calidad visual.</p>
  </header>

  <main class="layout">
    <section class="panel settings" aria-label="Ajustes">
      <h2>Ajustes</h2>

      <label class="field">
        <span>Calidad</span>
        <select id="quality">
          <option value="maxima">Máxima (casi sin pérdida visible)</option>
          <option value="alta" selected>Alta (recomendada)</option>
          <option value="equilibrada">Equilibrada (más ligera)</option>
        </select>
      </label>

      <fieldset>
        <legend>Imágenes</legend>
        <label class="field">
          <span>Formato de salida</span>
          <select id="format">
            <option value="auto" selected>Automático (recomendado)</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
            <option value="png">PNG</option>
            <option value="avif">AVIF</option>
          </select>
          <small class="hint">Automático: JPEG para fotos, WebP si tiene transparencia.</small>
        </label>
        <label class="field">
          <span>Tamaño máximo (lado mayor)</span>
          <select id="maxDimension">
            <option value="0" selected>Original (máx. 4472 px)</option>
            <option value="2048">2048 px (productos)</option>
            <option value="1600">1600 px</option>
            <option value="1200">1200 px</option>
          </select>
          <small class="hint">Nunca se agranda. 4472 px es el límite de Shopify.</small>
        </label>
      </fieldset>

      <fieldset>
        <legend>Videos</legend>
        <label class="field">
          <span>Resolución máxima</span>
          <select id="maxResolution">
            <option value="0">Original</option>
            <option value="2160">4K (2160p)</option>
            <option value="1080" selected>Full HD (1080p)</option>
            <option value="720">HD (720p)</option>
          </select>
        </label>
        <label class="field">
          <span>FPS máximos</span>
          <select id="maxFps">
            <option value="0">Original</option>
            <option value="30" selected>30 fps</option>
            <option value="24">24 fps</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="removeAudio" />
          <span>Quitar audio (ideal para videos de fondo / banners)</span>
        </label>
      </fieldset>
    </section>

    <section class="panel work">
      <label id="dropzone" class="dropzone" tabindex="0">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" hidden />
        <strong>Arrastra aquí tus imágenes y videos</strong>
        <span>o haz clic para seleccionarlos</span>
        <small>JPG, PNG, WebP, AVIF, GIF · MP4, MOV, WebM, MKV…</small>
      </label>

      <div class="summary" id="summary" hidden>
        <div>
          <span id="summaryText"></span>
        </div>
        <div class="summary-actions">
          <button type="button" id="clearBtn" class="ghost">Limpiar lista</button>
          <button type="button" id="zipBtn">Descargar todo (.zip)</button>
        </div>
      </div>

      <ul id="fileList" class="file-list"></ul>
    </section>
  </main>

  <template id="itemTemplate">
    <li class="item">
      <div class="thumb"></div>
      <div class="info">
        <div class="name"></div>
        <div class="meta"></div>
        <div class="bar"><div class="fill"></div></div>
      </div>
      <div class="result">
        <span class="badge"></span>
        <a class="download" hidden>Descargar</a>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
